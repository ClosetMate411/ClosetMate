<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B21B6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#5B21B6" flood-opacity="0.35"/>
    </filter>
    <clipPath id="roundedRect">
      <rect x="60" y="60" width="180" height="180" rx="40" ry="40"/>
    </clipPath>
  </defs>

  <!-- Icon background -->
  <rect x="60" y="60" width="180" height="180" rx="40" ry="40" fill="url(#iconGrad)" filter="url(#shadow)"/>
  <!-- Shimmer overlay -->
  <rect x="60" y="60" width="180" height="180" rx="40" ry="40" fill="url(#shimmer)"/>

  <!-- Hook -->
  <path d="M150 103 C150 103 150 90 161 86 C172 82 180 89 180 97 C180 104 173 108 166 108"
        fill="none" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <!-- Hanger left arm -->
  <path d="M150 108 C150 108 130 118 95 150" fill="none" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <!-- Hanger right arm -->
  <path d="M150 108 C150 108 170 118 205 150" fill="none" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <!-- Hanger bottom bar -->
  <line x1="88" y1="150" x2="212" y2="150" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <!-- Small folded shirt bottom hanging from bar -->
  <rect x="110" y="150" width="80" height="52" rx="5" fill="white" opacity="1"/>
  <!-- Shirt fold line detail -->
  <line x1="110" y1="166" x2="190" y2="166" stroke="url(#iconGrad)" stroke-width="2.5"/>

  <!-- Brand name: ClosetMate as one word with two-tone tspan -->
  <text x="275" y="175" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="90" 
        letter-spacing="-2">
    <tspan font-weight="700" fill="#3B0764">Closet</tspan><tspan font-weight="400" fill="#7C3AED">Mate</tspan>
  </text>
</svg>
