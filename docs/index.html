<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClosetMate — Mobile Preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: #0f172a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 24px;
    overflow-x: hidden;
  }

  .header {
    text-align: center;
    margin-bottom: 16px;
    flex-shrink: 0;
  }

  .header h1 {
    font-size: 20px;
    font-weight: 800;
    color: #f1f5f9;
    letter-spacing: -0.02em;
  }

  .header p {
    font-size: 12px;
    color: #64748b;
    margin-top: 3px;
  }

  /* Phone Frame — iPhone 12 (390×844) */
  .phone-container {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    min-height: 0;
  }

  .phone-frame {
    width: 405px;
    height: 862px;
    background: #1a1a1a;
    border-radius: 50px;
    padding: 12px;
    box-shadow:
      0 0 0 2px #333,
      0 0 0 5px #1a1a1a,
      0 25px 70px rgba(0, 0, 0, 0.6),
      0 0 100px rgba(59, 130, 246, 0.06);
    position: relative;
  }

  /* Notch (iPhone 12 style) */
  .phone-notch {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 164px;
    height: 32px;
    background: #1a1a1a;
    border-radius: 0 0 20px 20px;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .notch-speaker {
    width: 46px;
    height: 4px;
    background: #2a2a2a;
    border-radius: 4px;
  }

  .notch-camera {
    width: 11px;
    height: 11px;
    background: #0d0d0d;
    border-radius: 50%;
    border: 2px solid #1f1f1f;
  }

  /* Screen */
  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 38px;
    overflow: hidden;
    background: #fff;
    position: relative;
  }

  .phone-screen iframe {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 38px;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* Home indicator */
  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    background: #000;
    border-radius: 4px;
    opacity: 0.25;
    z-index: 5;
    pointer-events: none;
  }

  /* Side buttons */
  .btn-power {
    position: absolute;
    right: -3px;
    top: 180px;
    width: 4px;
    height: 78px;
    background: #333;
    border-radius: 0 3px 3px 0;
  }

  .btn-vol-up {
    position: absolute;
    left: -3px;
    top: 158px;
    width: 4px;
    height: 42px;
    background: #333;
    border-radius: 3px 0 0 3px;
  }

  .btn-vol-down {
    position: absolute;
    left: -3px;
    top: 210px;
    width: 4px;
    height: 42px;
    background: #333;
    border-radius: 3px 0 0 3px;
  }

  .btn-silent {
    position: absolute;
    left: -3px;
    top: 118px;
    width: 4px;
    height: 26px;
    background: #333;
    border-radius: 3px 0 0 3px;
  }

  /* Loading state */
  .loading-screen {
    position: absolute;
    inset: 0;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 38px;
    z-index: 3;
    transition: opacity 0.5s;
  }

  .loading-screen.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .loading-logo {
    font-size: 26px;
    font-weight: 800;
    color: #1a1a1a;
    margin-bottom: 12px;
  }

  .loading-spinner {
    width: 28px;
    height: 28px;
    border: 3px solid #e2e8f0;
    border-top-color: #7c3aed;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Controls */
  .controls {
    margin-top: 14px;
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-shrink: 0;
  }

  .controls button {
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #94a3b8;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }

  .controls button:hover {
    background: #334155;
    color: #f1f5f9;
  }

  .info-text {
    margin-top: 10px;
    font-size: 11px;
    color: #475569;
    text-align: center;
    max-width: 400px;
    line-height: 1.5;
    flex-shrink: 0;
  }

  /* ═══ Responsive ═══ */

  @media (min-height: 1050px) {
    .phone-frame { width: 420px; height: 900px; }
  }

  @media (max-height: 920px) {
    .phone-frame { width: 375px; height: 790px; border-radius: 46px; }
    .phone-screen { border-radius: 34px; }
    .phone-screen iframe { border-radius: 34px; }
    .phone-notch { width: 150px; height: 28px; }
    .loading-screen { border-radius: 34px; }
  }

  @media (max-height: 750px) {
    body { padding: 10px 16px; }
    .header { margin-bottom: 8px; }
    .header h1 { font-size: 16px; }
    .phone-frame { width: 320px; height: 660px; border-radius: 42px; padding: 10px; }
    .phone-screen { border-radius: 32px; }
    .phone-screen iframe { border-radius: 32px; }
    .phone-notch { width: 130px; height: 24px; }
    .loading-screen { border-radius: 32px; }
    .controls { margin-top: 8px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>📱 ClosetMate Mobile Preview</h1>
  <p>Browser-based mobile simulator — iPhone 12 — Expo React Native</p>
</div>

<div class="phone-container">
  <div class="phone-frame">
    <!-- Side buttons -->
    <div class="btn-power"></div>
    <div class="btn-silent"></div>
    <div class="btn-vol-up"></div>
    <div class="btn-vol-down"></div>

    <!-- Notch (iPhone 12) -->
    <div class="phone-notch">
      <div class="notch-speaker"></div>
      <div class="notch-camera"></div>
    </div>

    <!-- Screen -->
    <div class="phone-screen">
      <!-- Loading -->
      <div class="loading-screen" id="loadingScreen">
        <div class="loading-logo">ClosetMate</div>
        <div class="loading-spinner"></div>
      </div>

      <!-- App iframe -->
      <iframe
        id="appFrame"
        src="./app.html"
        allow="camera; microphone; geolocation"
        scrolling="yes"
      ></iframe>

      <!-- Home indicator -->
      <div class="home-indicator"></div>
    </div>
  </div>
</div>

<!-- Controls -->
<div class="controls">
  <button onclick="reloadApp()">🔄 Yenile</button>
</div>

<div class="info-text">
  ClosetMate mobil uygulamasinin web preview'i
</div>

<script>
  // Auto-hide loading when app loads
  document.getElementById('appFrame').onload = () => {
    setTimeout(() => document.getElementById('loadingScreen').classList.add('hidden'), 600);
  };

  // Reload
  function reloadApp() {
    const frame = document.getElementById('appFrame');
    const loading = document.getElementById('loadingScreen');
    loading.classList.remove('hidden');
    frame.src = frame.src;
    frame.onload = () => {
      setTimeout(() => loading.classList.add('hidden'), 600);
    };
  }
</script>
</body>
</html>
