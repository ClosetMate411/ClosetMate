<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClosetMate — Mobile Preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: #0f172a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }

  .header {
    text-align: center;
    margin-bottom: 24px;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 800;
    color: #f1f5f9;
    letter-spacing: -0.02em;
  }

  .header p {
    font-size: 13px;
    color: #64748b;
    margin-top: 4px;
  }

  /* Phone Frame */
  .phone-container {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .phone-frame {
    width: 380px;
    height: 780px;
    background: #1a1a1a;
    border-radius: 50px;
    padding: 12px;
    box-shadow:
      0 0 0 2px #333,
      0 0 0 4px #1a1a1a,
      0 20px 60px rgba(0, 0, 0, 0.5),
      0 0 80px rgba(59, 130, 246, 0.08);
    position: relative;
  }

  /* Notch */
  .phone-notch {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    height: 30px;
    background: #1a1a1a;
    border-radius: 0 0 18px 18px;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .notch-camera {
    width: 12px;
    height: 12px;
    background: #0a0a0a;
    border-radius: 50%;
    border: 2px solid #222;
  }

  .notch-speaker {
    width: 50px;
    height: 4px;
    background: #222;
    border-radius: 4px;
  }

  /* Screen */
  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 38px;
    overflow: hidden;
    background: #000;
    position: relative;
  }

  .phone-screen iframe {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 38px;
  }

  /* Status bar overlay */
  .status-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 44px;
    background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 12px 28px 0;
    z-index: 5;
    pointer-events: none;
    border-radius: 38px 38px 0 0;
  }

  .status-time {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
  }

  .status-icons {
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .status-icons svg {
    width: 16px;
    height: 16px;
    fill: #fff;
  }

  /* Bottom bar */
  .home-indicator {
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 130px;
    height: 5px;
    background: #fff;
    border-radius: 4px;
    opacity: 0.3;
    z-index: 5;
    pointer-events: none;
  }

  /* Side buttons */
  .btn-power {
    position: absolute;
    right: -3px;
    top: 160px;
    width: 4px;
    height: 70px;
    background: #333;
    border-radius: 0 3px 3px 0;
  }

  .btn-vol-up {
    position: absolute;
    left: -3px;
    top: 140px;
    width: 4px;
    height: 40px;
    background: #333;
    border-radius: 3px 0 0 3px;
  }

  .btn-vol-down {
    position: absolute;
    left: -3px;
    top: 190px;
    width: 4px;
    height: 40px;
    background: #333;
    border-radius: 3px 0 0 3px;
  }

  /* Loading state */
  .loading-screen {
    position: absolute;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 38px;
    z-index: 3;
    transition: opacity 0.5s;
  }

  .loading-screen.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .loading-logo {
    font-size: 28px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 8px;
  }

  .loading-spinner {
    width: 24px;
    height: 24px;
    border: 3px solid #333;
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Controls */
  .controls {
    margin-top: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .controls button {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #94a3b8;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }

  .controls button:hover {
    background: #334155;
    color: #f1f5f9;
  }

  .controls button.active {
    background: #3b82f6;
    color: #fff;
    border-color: #3b82f6;
  }

  .info-text {
    margin-top: 16px;
    font-size: 11px;
    color: #475569;
    text-align: center;
    max-width: 400px;
    line-height: 1.5;
  }

  /* Responsive */
  @media (max-height: 900px) {
    .phone-frame { width: 320px; height: 660px; border-radius: 44px; padding: 10px; }
    .phone-screen { border-radius: 34px; }
    .phone-screen iframe { border-radius: 34px; }
    .phone-notch { width: 140px; height: 26px; }
    .loading-screen { border-radius: 34px; }
    .status-bar { border-radius: 34px 34px 0 0; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>📱 ClosetMate Mobile Preview</h1>
  <p>Browser-based mobile simulator — Expo React Native</p>
</div>

<div class="phone-container">
  <div class="phone-frame">
    <!-- Side buttons -->
    <div class="btn-power"></div>
    <div class="btn-vol-up"></div>
    <div class="btn-vol-down"></div>

    <!-- Notch -->
    <div class="phone-notch">
      <div class="notch-speaker"></div>
      <div class="notch-camera"></div>
    </div>

    <!-- Screen -->
    <div class="phone-screen">
      <!-- Status bar -->
      <div class="status-bar">
        <span class="status-time" id="statusTime">12:00</span>
        <div class="status-icons">
          <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
          <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4zM13 18h-2v-2h2v2zm0-4h-2V9h2v5z"/></svg>
        </div>
      </div>

      <!-- Loading -->
      <div class="loading-screen" id="loadingScreen">
        <div class="loading-logo">ClosetMate</div>
        <div class="loading-spinner"></div>
      </div>

      <!-- App iframe -->
      <iframe
        id="appFrame"
        src="./index.html"
        allow="camera; microphone; geolocation"
      ></iframe>

      <!-- Home indicator -->
      <div class="home-indicator"></div>
    </div>
  </div>
</div>

<!-- Controls -->
<div class="controls">
  <button onclick="setDevice('iphone14')" class="active" id="btn-iphone14">iPhone 14</button>
  <button onclick="setDevice('pixel7')" id="btn-pixel7">Pixel 7</button>
  <button onclick="setDevice('small')" id="btn-small">SE / Mini</button>
  <button onclick="reloadApp()">🔄 Yenile</button>
</div>

<div class="info-text">
  ClosetMate mobil uygulamasinin web preview'i. Cihaz boyutunu degistirmek icin yukardaki butonlari kullanin.
</div>

<script>
  // Update status bar time
  function updateTime() {
    const now = new Date();
    document.getElementById('statusTime').textContent =
      now.getHours().toString().padStart(2, '0') + ':' +
      now.getMinutes().toString().padStart(2, '0');
  }
  updateTime();
  setInterval(updateTime, 30000);

  // Auto-hide loading when app loads
  document.getElementById('appFrame').onload = () => {
    setTimeout(() => document.getElementById('loadingScreen').classList.add('hidden'), 500);
  };

  // Reload
  function reloadApp() {
    const frame = document.getElementById('appFrame');
    const loading = document.getElementById('loadingScreen');
    loading.classList.remove('hidden');
    frame.src = frame.src;
    frame.onload = () => {
      setTimeout(() => loading.classList.add('hidden'), 500);
    };
  }

  // Device presets
  const devices = {
    iphone14: { w: 380, h: 780, r: 50 },
    pixel7: { w: 360, h: 760, r: 40 },
    small: { w: 320, h: 640, r: 44 },
  };

  function setDevice(id) {
    const d = devices[id];
    const frame = document.querySelector('.phone-frame');
    frame.style.width = d.w + 'px';
    frame.style.height = d.h + 'px';
    frame.style.borderRadius = d.r + 'px';

    document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('btn-' + id);
    if (btn) btn.classList.add('active');
  }
</script>
</body>
</html>
